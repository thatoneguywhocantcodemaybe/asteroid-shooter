[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asteroid-shooter"
version = "0.1.0"
description = "A Pygame asteroid shooter game with helper ships and save/load support"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Your Name" }]
keywords = ["game", "pygame", "asteroid", "arcade"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Games/Entertainment :: Arcade",
]
dependencies = [
    "pygame>=2.5.0",
]

[project.urls]
Homepage = "https://github.com/thatoneguywhocantcodemaybe/asteroid-shooter"
Repository = "https://github.com/thatoneguywhocantcodemaybe/asteroid-shooter"
Issues = "https://github.com/thatoneguywhocantcodemaybe/asteroid-shooter/issues"

[project.scripts]
asteroid-shooter = "asteroid_shooter.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
